<!doctype html><html lang="da" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0d0e"><title>Form</title>
<style>
:root{--bg:#0b0d0e;--s:#121517;--s2:#1a1e21;--b:#252b2f;--t:#e8ecee;--m:#8b979e;--a:#3ddc97;--ai:#04140c;--d:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f5f7f8;--s:#fff;--s2:#eef1f3;--b:#dde2e6;--t:#14181b;--m:#5d6a72;--a:#14a36a;--ai:#fff;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:24px 12px;background:var(--s);border-right:1px solid var(--b)}
.brand{font-weight:700;font-size:1.1rem;padding:0 12px 24px}.brand:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--a);margin-right:10px;box-shadow:0 0 0 4px rgba(61,220,151,.15)}
nav .n{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:var(--m);padding:10px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;text-align:left}nav .n.on{background:rgba(61,220,151,.12);color:var(--a)}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{padding:36px 40px 64px;max-width:960px;width:100%;margin:auto;animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1{font-size:1.65rem;margin:0 0 4px;letter-spacing:-.02em}h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--m);margin:0 0 12px}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:14px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:14px}.g .card{margin:0}
.big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}.m{color:var(--m)}
.btn{font:inherit;font-weight:550;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--b);background:var(--s2);color:var(--t);cursor:pointer}.btn.p{background:var(--a);border-color:var(--a);color:var(--ai)}.btn:active{transform:scale(.97)}
input,select,textarea{font:inherit;font-size:16px;min-height:40px;width:100%;background:var(--s2);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:8px 12px}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--a)}
label{display:block;margin-bottom:10px;color:var(--m);font-size:.85rem}label input,label select{margin-top:4px;color:var(--t)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--b)}
.bar{height:8px;background:var(--s2);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--a);border-radius:9px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.next{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.35);margin:14px 0;font-weight:600}
.chart{width:100%;height:120px;display:block}.lbls{display:flex;justify-content:space-between;font-size:.72rem;color:var(--m)}
.mac{display:flex;gap:24px;margin:10px 0}.mac div{display:flex;flex-direction:column;font-weight:600}.mac span{font-size:.75rem;color:var(--m);font-weight:400}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}#modal.o{display:flex}
#modal>div{background:var(--s);border:1px solid var(--b);border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:86vh;overflow:auto}#modal h2{margin:0 0 12px;font-size:1.1rem}
.err{color:var(--d);margin:6px 0}
.set{display:grid;grid-template-columns:40px 1fr 1fr 84px;gap:8px;align-items:center;padding:6px 0}.set.d{background:rgba(61,220,151,.12);border-radius:10px;padding:6px 8px}
.tabs{display:flex;gap:4px;background:var(--s2);padding:4px;border-radius:12px;margin:12px 0;overflow:auto}.tabs button{flex:1;white-space:nowrap;background:none;border:0;color:var(--m);padding:8px 12px;border-radius:9px;font:inherit;cursor:pointer}.tabs .on{background:var(--s);color:var(--t)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:8px 16px;border-radius:99px;display:none;z-index:10}
@media(max-width:768px){#app{display:block}nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--b);z-index:5}.brand{display:none}nav .n{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 2px;align-items:center;justify-content:center;flex:1}main{padding:16px 16px 104px}h1{font-size:1.45rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast" role="status"></div>
<script>
const K='form-html-v1',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>iso(new Date());
const shift=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36),r1=n=>Math.round(n*10)/10;
const num=v=>{const n=Number(v);return Number.isFinite(n)&&n>=0?n:0};
const dn=s=>new Date(s+'T12:00:00').toLocaleDateString('da-DK',{weekday:'short'});
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)};
const BASE=[['Havregryn',370,13,60,7],['Ris, kogte',130,2.7,28,.3],['Kartofler, kogte',77,2,17,.1],['Fuldkornsbrød',250,9,41,4],['Æg',143,13,1,10],['Letmælk',47,3.5,4.8,1.5],['Naturyoghurt',61,3.5,4.7,3.3],['Kyllingebryst, kogt',165,31,0,3.6],['Laks',208,20,0,13],['Linser, kogte',116,9,20,.4],['Banan',89,1.1,23,.3],['Peanuts',567,26,16,49],['Olivenolie',884,0,0,100]].map((a,i)=>({id:'b'+i,name:a[0],kcal:a[1],p:a[2],c:a[3],f:a[4],est:1}));
const SLOTS=[['b','Morgenmad'],['l','Frokost'],['d','Aftensmad'],['s','Snacks']],SL=Object.fromEntries(SLOTS);
const IC={home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',food:'M7 3v8M11 3v8M9 3v18M17 3c-2 2-3 5-3 8h3v10',train:'M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12',prog:'M3 20h18M6 16v-6M12 16V5M18 16v-4',set:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M2 12h3M19 12h3'};
const TABS=[['home','Hjem'],['food','Mad'],['train','Træning'],['prog','Fremskridt'],['set','Mere']];
function def(){return{meals:[],foods:[],plans:[],sessions:[],active:null,water:{},weights:{},t:{kcal:0,p:0,water:0},theme:'dark'}}
function clean(d){const x=def();if(!d||typeof d!=='object')return x;for(const k of['meals','foods','plans','sessions'])if(Array.isArray(d[k]))x[k]=d[k].filter(o=>o&&typeof o==='object');x.meals=x.meals.filter(m=>m.date&&m.slot&&m.k);for(const k of['water','weights'])if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))x[k]=d[k];if(d.t&&typeof d.t==='object')x.t={kcal:num(d.t.kcal),p:num(d.t.p),water:num(d.t.water)};if(d.active&&Array.isArray(d.active.ex)&&d.active.ex.length)x.active=d.active;if(d.theme==='light')x.theme='light';return x}
function load(){try{return clean(JSON.parse(localStorage.getItem(K)))}catch{return def()}}
let S=load(),V={tab:'home',date:today(),range:30},M={},T={end:0,left:0,run:false};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch{toast('Kunne ikke gemme i denne browser')}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2200)}
const allFoods=()=>[...S.foods,...BASE],calc=(f,q)=>({kcal:r1(f.kcal*q/100),p:r1(f.p*q/100),c:r1(f.c*q/100),f:r1(f.f*q/100)});
const tot=a=>a.reduce((x,m)=>({kcal:x.kcal+m.kcal,p:x.p+m.p,c:x.c+m.c,f:x.f+m.f}),{kcal:0,p:0,c:0,f:0});
const bar=(v,g)=>g?`<div class="bar"><i style="width:${Math.min(100,v/g*100)}%"></i></div>`:'';
const mac=t=>`<div class="mac"><div><span>Protein</span>${Math.round(t.p)} g</div><div><span>Kulhydrat</span>${Math.round(t.c)} g</div><div><span>Fedt</span>${Math.round(t.f)} g</div></div>`;
function bars(d){const mx=Math.max(1,...d.map(x=>x.v)),w=100/d.length;return`<svg viewBox="0 0 100 100" preserveAspectRatio="none" class="chart" role="img" aria-label="Søjlediagram">${d.map((x,i)=>`<rect x="${i*w+w*.15}" y="${100-x.v/mx*92}" width="${w*.7}" height="${x.v/mx*92}" rx="1.5" fill="var(--a)"/>`).join('')}</svg><div class="lbls">${d.map(x=>`<span>${x.l}</span>`).join('')}</div>`}
function line(p){if(p.length<2)return'<p class="m">Der skal mindst to målinger til en kurve.</p>';const ys=p.map(x=>x.y),lo=Math.min(...ys),sp=Math.max(...ys)-lo||1,P=p.map((x,i)=>[i/(p.length-1)*296+2,70-(x.y-lo)/sp*60]);return`<svg viewBox="0 0 300 80" class="chart" role="img" aria-label="Kurve"><polyline fill="none" stroke="var(--a)" stroke-width="2" points="${P.map(x=>x.join(',')).join(' ')}"/>${P.map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="2.5" fill="var(--a)"/>`).join('')}</svg><div class="lbls"><span>${p[0].l}: ${p[0].y}</span><span>${p[p.length-1].l}: ${p[p.length-1].y}</span></div>`}
function modal(h){$('#modal').innerHTML=`<div role="dialog" aria-modal="true">${h}</div>`;$('#modal').classList.add('o');const i=$('#modal input,#modal textarea');i&&i.focus()}
const close=()=>$('#modal').classList.remove('o');
function ask(msg,fn){M.ok=fn;modal(`<p>${msg}</p><div class="acts"><button class="btn p" data-a="yes">Ja</button><button class="btn" data-a="close">Nej</button></div>`)}
function home(){const t=today(),ms=S.meals.filter(m=>m.date===t),T0=tot(ms),w=S.water[t]||0;
const wk=Array.from({length:7},(_,i)=>shift(t,i-6)).map(d=>({l:dn(d).slice(0,2),v:Math.round(tot(S.meals.filter(m=>m.date===d)).kcal)}));
const lg=wk.filter(x=>x.v).length,wo=S.sessions.filter(s=>s.date>=shift(t,-6)).length;
const nx=S.active?['Træning i gang: '+esc(S.active.name),'train','Fortsæt']:!ms.length?['Log dit første måltid i dag','food','Log mad']:S.plans.length&&!S.sessions.some(s=>s.date===t)?['Klar til dagens træning?','train','Træning']:['Husk vand hen over dagen'];
return`<h1>I dag</h1><p class="m">${new Date().toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'})}</p>
<div class="next"><span>${nx[0]}</span>${nx[1]?`<button class="btn p" data-a="tab" data-v="${nx[1]}">${nx[2]}</button>`:''}</div>
<div class="g"><div class="card"><h3>Ernæring</h3>${ms.length?`<div class="big">${Math.round(T0.kcal)} <span class="m" style="font-size:1rem">kcal</span></div>${bar(T0.kcal,S.t.kcal)}${mac(T0)}<p class="m">${ms.length} poster logget${S.t.p?` · protein ${Math.round(T0.p)}/${S.t.p} g`:''}</p>`:'<p class="m">Intet logget endnu.</p>'}</div>
<div class="card"><h3>Vand</h3><div class="big">${w} <span class="m" style="font-size:1rem">ml</span></div>${bar(w,S.t.water)}${S.t.water?`<p class="m">Mål ${S.t.water} ml</p>`:'<p class="m">Intet mål sat</p>'}<div class="acts"><button class="btn p" data-a="water" data-v="250">+250</button><button class="btn" data-a="water" data-v="500">+500</button><button class="btn" data-a="water" data-v="-250" aria-label="Træk 250 fra">−250</button></div></div>
<div class="card"><h3>Ugen</h3><div class="mac"><div><span>Dage med mad</span>${lg}/7</div><div><span>Træninger</span>${wo}</div></div></div></div>
<div class="card"><h3>Kalorier, 7 dage</h3>${bars(wk)}</div>`}
function foodPg(){const ms=S.meals.filter(m=>m.date===V.date),T0=tot(ms),it=V.date===today();
return`<h1>Mad</h1><p class="m">${it?'I dag':esc(V.date)}</p><div class="acts"><button class="btn" data-a="dprev">‹ Forrige</button>${it?'':'<button class="btn" data-a="dnext">Næste ›</button><button class="btn" data-a="dtoday">I dag</button>'}</div>
<div class="card"><h3>Total</h3><div class="big">${Math.round(T0.kcal)} <span class="m" style="font-size:1rem">kcal</span></div>${S.t.kcal?bar(T0.kcal,S.t.kcal)+`<p class="m">${Math.abs(Math.round(S.t.kcal-T0.kcal))} kcal ${T0.kcal>S.t.kcal?'over':'tilbage'}</p>`:'<p class="m">Intet kaloriemål sat (under Mere).</p>'}${mac(T0)}</div>`+
SLOTS.map(([k,l])=>{const L=ms.filter(m=>m.slot===k);return`<div class="card"><div class="row" style="border:0;padding:0 0 6px"><h3 style="margin:0">${l} · ${Math.round(tot(L).kcal)} kcal</h3><button class="btn" data-a="add" data-v="${k}">+ Tilføj</button></div>${L.map(m=>`<div class="row"><span>${esc(m.name)}<br><span class="m">${m.qty} g · ${Math.round(m.kcal)} kcal · P ${m.p} · K ${m.c} · F ${m.f}</span></span><span class="acts" style="margin:0"><button class="btn" aria-label="Rediger mængde" data-a="editq" data-v="${m.id}">✎</button><button class="btn" aria-label="Kopiér" data-a="dup" data-v="${m.id}">⧉</button><button class="btn" aria-label="Slet" data-a="del" data-v="${m.id}">✕</button></span></div>`).join('')}</div>`}).join('')}
const flist=q=>{q=q.toLowerCase();const L=allFoods().filter(f=>f.name.toLowerCase().includes(q));return L.length?L.map(f=>`<button class="btn" style="width:100%;text-align:left;margin-bottom:6px" data-a="pick" data-v="${f.id}">${esc(f.name)} <span class="m">· ${Math.round(f.kcal)} kcal/100 g${f.est?' · estimat':''}</span></button>`).join(''):'<p class="m">Ingen match. Opret din egen fødevare.</p>'};
const pv=()=>{const c=calc(M.f,num($('#gq').value));$('#pv').textContent=`${Math.round(c.kcal)} kcal · P ${c.p} g · K ${c.c} g · F ${c.f} g`};
function trainPg(){const PR={};S.sessions.forEach(s=>(s.ex||[]).forEach(e=>(e.sets||[]).forEach(x=>{if(x.w>(PR[e.n]?PR[e.n].w:-1))PR[e.n]=x})));const last=[...S.sessions].reverse().slice(0,8);
return`<h1>Træning</h1><div class="acts"><button class="btn p" data-a="newplan">+ Ny plan</button></div><div class="card"><h3>Dine planer</h3>${S.plans.length?S.plans.map(p=>`<div class="row"><span><b>${esc(p.name)}</b><br><span class="m">${p.ex.length} øvelser</span></span><span class="acts" style="margin:0"><button class="btn p" data-a="start" data-v="${p.id}">Start</button><button class="btn" data-a="delplan" data-v="${p.id}" aria-label="Slet plan">✕</button></span></div>`).join(''):'<p class="m">Ingen planer endnu. Opret en plan for at starte en træning.</p>'}</div>
<div class="g"><div class="card"><h3>Rekorder</h3>${Object.keys(PR).length?Object.entries(PR).map(([n,x])=>`<div class="row"><span>${esc(n)}</span><span class="m">${x.w} kg × ${x.r}</span></div>`).join(''):'<p class="m">Vises, når du har logget sæt.</p>'}</div><div class="card"><h3>Seneste pas</h3>${last.length?last.map(s=>`<div class="row"><span>${esc(s.name)}</span><span class="m">${s.date.slice(5)} · ${s.vol} kg · ${Math.round(s.dur/60)} min</span></div>`).join(''):'<p class="m">Ingen afsluttede træninger.</p>'}</div></div>`}
const prev=n=>{const s=[...S.sessions].reverse().find(x=>(x.ex||[]).some(e=>e.n===n));const e=s&&s.ex.find(e=>e.n===n);return e&&e.sets.length?e.sets:null};
const left=()=>T.run?Math.max(0,(T.end-Date.now())/1000):T.left/1000;
function active(){const a=S.active,e=a.ex[a.ei],pr=prev(e.n),L=a.ei===a.ex.length-1;
return`<h1>${esc(a.name)}</h1><p class="m">Øvelse ${a.ei+1} af ${a.ex.length} · <span id="el">${mmss((Date.now()-a.start)/1000)}</span></p>
<div class="card"><h3>${esc(e.n)}</h3><p class="m">Mål ${e.sets} × ${e.reps} · hvile ${e.rest} s</p>${pr?`<p>Sidst: <b>${pr.map(s=>s.w+'×'+s.r).join(', ')}</b></p>`:''}<div class="set m"><span>Sæt</span><span>kg</span><span>Reps</span><span></span></div>
${e.s.map((s,i)=>`<div class="set ${s.d?'d':''}"><span>${i+1}</span><input type="number" inputmode="decimal" step="0.5" min="0" aria-label="Kilo" data-f="w" data-i="${i}" value="${esc(s.w)}"><input type="number" inputmode="numeric" min="0" aria-label="Reps" placeholder="${e.reps}" data-f="r" data-i="${i}" value="${esc(s.r)}"><button class="btn ${s.d?'p':''}" data-a="sd" data-v="${i}" aria-pressed="${s.d}">${s.d?'✓':'Færdig'}</button></div>`).join('')}<div class="acts"><button class="btn" data-a="aset">+ Sæt</button></div></div>
<div class="card"><h3>Hviletimer</h3><div class="big" id="tm">${mmss(left())}</div><div class="acts">${T.run?'<button class="btn" data-a="tp">Pause</button>':T.left?'<button class="btn p" data-a="tr">Fortsæt</button>':'<button class="btn p" data-a="ts">Start</button>'}<button class="btn" data-a="tz">Nulstil</button></div></div>
<div class="acts">${a.ei?'<button class="btn" data-a="pex">‹ Forrige</button>':''}${L?'':'<button class="btn p" data-a="nex">Næste ›</button>'}<button class="btn ${L?'p':''}" data-a="fin">Afslut træning</button><button class="btn" data-a="dis">Kassér</button></div>`}
function progPg(){const t=today(),R=V.range,all=[...Object.keys(S.weights),...S.meals.map(m=>m.date),...S.sessions.map(s=>s.date)].sort(),from=R?shift(t,-R+1):(all[0]||t),span=Math.round((new Date(t)-new Date(from))/864e5)+1;
const E=Object.entries(S.weights).sort(),W=E.filter(([d])=>d>=from).map(([d])=>{const a=E.filter(([x])=>x<=d&&x>=shift(d,-6)).map(([,y])=>+y);return{l:d.slice(5),y:r1(a.reduce((p,c)=>p+c,0)/a.length)}});
const fd=new Set(S.meals.filter(m=>m.date>=from).map(m=>m.date)).size,wc=S.sessions.filter(s=>s.date>=from).length;
return`<h1>Fremskridt</h1><div class="tabs" role="tablist">${[[7,'7 dage'],[30,'30 dage'],[90,'90 dage'],[0,'Alt']].map(([v,l])=>`<button class="${R===v?'on':''}" data-a="range" data-v="${v}">${l}</button>`).join('')}</div>
<div class="card"><h3>Registrér vægt (valgfrit)</h3><p class="m">Du behøver ikke veje dig dagligt. Én gang om ugen er rigeligt.</p><label>Kropsvægt (kg)<input id="wv" type="number" step="0.1" inputmode="decimal"></label><p id="er" class="err"></p><button class="btn p" data-a="logw">Gem</button></div>
<div class="g"><div class="card"><h3>Konsistens</h3><div class="mac"><div><span>Dage med mad</span>${fd}/${span}</div><div><span>Træninger</span>${wc}</div></div></div><div class="card"><h3>Vægt, 7-dages gennemsnit</h3>${line(W)}<p class="m">Enkeltmålinger svinger. Se på tendensen. Er du bekymret for lav vægt eller uforklarlige ændringer, så tal med en læge.</p>${E.slice(-3).reverse().map(([d,y])=>`<div class="row"><span>${d} · ${y} kg</span><button class="btn" data-a="delw" data-v="${d}" aria-label="Slet måling">✕</button></div>`).join('')}</div></div>
<div class="card"><h3>Træningsvolumen pr. pas</h3>${S.sessions.length?bars(S.sessions.slice(-12).map(s=>({l:s.date.slice(8),v:s.vol}))):'<p class="m">Ingen afsluttede træninger endnu.</p>'}</div>`}
function setPg(){return`<h1>Mere</h1><div class="card"><h3>Mål (valgfrie)</h3><p class="m">Tomt eller 0 slår målet fra.</p><label>Kalorier (kcal)<input id="tk" type="number" min="0" value="${S.t.kcal||''}"></label><label>Protein (g)<input id="tp" type="number" min="0" value="${S.t.p||''}"></label><label>Vand (ml)<input id="tw" type="number" min="0" value="${S.t.water||''}"></label><button class="btn p" data-a="savet">Gem mål</button></div>
<div class="card"><h3>Udseende</h3><div class="acts"><button class="btn ${S.theme==='dark'?'p':''}" data-a="theme" data-v="dark">Mørk</button><button class="btn ${S.theme==='light'?'p':''}" data-a="theme" data-v="light">Lys</button></div></div>
<div class="card"><h3>Backup</h3><p class="m">Data ligger kun i denne browser. Kopiér teksten herunder og gem den et sikkert sted (fx Noter). Importér ved at indsætte den igen.</p><div class="acts"><button class="btn p" data-a="exp">Vis backup</button></div><textarea id="bk" rows="5" aria-label="Backup" placeholder="Backup-tekst vises her, eller indsæt en backup du vil importere"></textarea><div class="acts"><button class="btn" data-a="cp">Kopiér</button><button class="btn" data-a="imp">Importér</button></div></div>
<div class="card"><h3>Slet data</h3><button class="btn" data-a="wipe">Slet alle data</button></div>`}
function render(){const pg=S.active&&V.tab==='train'?active():({home,food:foodPg,train:trainPg,prog:progPg,set:setPg})[V.tab]();$('#app').innerHTML=`<nav aria-label="Hovedmenu"><div class="brand">Form</div>${TABS.map(([k,l])=>`<button class="n ${V.tab===k?'on':''}" data-a="tab" data-v="${k}"${V.tab===k?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[k]}"/></svg>${l}</button>`).join('')}</nav><main>${pg}</main>`}
const A={};
A.tab=v=>{V.tab=v;render();scrollTo(0,0)};A.close=close;A.yes=()=>{const f=M.ok;close();f&&f()};
A.water=v=>{const t=today();S.water[t]=Math.max(0,(S.water[t]||0)+Number(v));save();render()};
A.dprev=()=>{V.date=shift(V.date,-1);render()};A.dnext=()=>{if(V.date<today())V.date=shift(V.date,1);render()};A.dtoday=()=>{V.date=today();render()};
A.add=v=>{M={slot:v};modal(`<h2>Tilføj til ${SL[v]}</h2><input id="fq" placeholder="Søg fødevare" aria-label="Søg"><div id="fl" style="margin-top:10px">${flist('')}</div><div class="acts"><button class="btn" data-a="newfood">+ Egen fødevare</button><button class="btn" data-a="close">Luk</button></div><p class="m">Startlisten er omtrentlige værdier pr. 100 g. Tjek varedeklarationen, eller opret din egen.</p>`)};
A.pick=v=>{const f=allFoods().find(x=>x.id===v);if(!f)return;M.f=f;modal(`<h2>${esc(f.name)}</h2><label>Mængde (gram)<input id="gq" type="number" inputmode="decimal" value="100" min="1" max="5000"></label><p id="pv" class="m"></p><p id="er" class="err"></p><div class="acts"><button class="btn p" data-a="addfood">Tilføj</button><button class="btn" data-a="close">Annullér</button></div>`);pv()};
A.addfood=()=>{const q=Number($('#gq').value);if(!(q>=1&&q<=5000))return $('#er').textContent='Mængden skal være mellem 1 og 5000 g.';const f=M.f;S.meals.push({id:uid(),date:V.date,slot:M.slot,name:f.name,qty:q,k:{kcal:f.kcal,p:f.p,c:f.c,f:f.f},...calc(f,q)});save();close();render()};
A.newfood=()=>modal(`<h2>Egen fødevare (pr. 100 g)</h2><label>Navn<input id="nn"></label><label>Kalorier (kcal)<input id="nk" type="number" min="0"></label><label>Protein (g)<input id="np" type="number" min="0"></label><label>Kulhydrat (g)<input id="nc" type="number" min="0"></label><label>Fedt (g)<input id="nf" type="number" min="0"></label><p id="er" class="err"></p><div class="acts"><button class="btn p" data-a="savefood">Gem og vælg</button><button class="btn" data-a="close">Annullér</button></div>`);
A.savefood=()=>{const g=i=>$('#'+i).value.trim(),n=g('nn'),v=['nk','np','nc','nf'].map(i=>Number(g(i)||0)),e=$('#er');if(!n)return e.textContent='Navn mangler.';if(g('nk')===''||!(v[0]>=0&&v[0]<=900))return e.textContent='Kalorier pr. 100 g: 0–900.';if(v.slice(1).some(x=>!(x>=0&&x<=100))||v[1]+v[2]+v[3]>101)return e.textContent='Protein, kulhydrat og fedt: 0–100 g pr. 100 g (sum højst 100).';const f={id:'u'+uid(),name:n,kcal:v[0],p:v[1],c:v[2],f:v[3]};S.foods.push(f);save();A.pick(f.id)};
A.editq=v=>{const m=S.meals.find(x=>x.id===v);if(!m)return;M={id:v,f:m.k};modal(`<h2>${esc(m.name)}</h2><label>Mængde (gram)<input id="gq" type="number" inputmode="decimal" value="${m.qty}" min="1" max="5000"></label><p id="pv" class="m"></p><p id="er" class="err"></p><div class="acts"><button class="btn p" data-a="saveq">Gem</button><button class="btn" data-a="close">Annullér</button></div>`);pv()};
A.saveq=()=>{const q=Number($('#gq').value);if(!(q>=1&&q<=5000))return $('#er').textContent='Mængden skal være mellem 1 og 5000 g.';const m=S.meals.find(x=>x.id===M.id);Object.assign(m,{qty:q},calc(m.k,q));save();close();render()};
A.dup=v=>{const m=S.meals.find(x=>x.id===v);S.meals.push({...m,id:uid()});save();render()};
A.del=v=>ask('Slet denne post?',()=>{S.meals=S.meals.filter(x=>x.id!==v);save();render()});
A.newplan=()=>modal(`<h2>Ny træningsplan</h2><label>Navn<input id="pn" placeholder="fx Overkrop A"></label><label>Øvelser (én pr. linje)<textarea id="px" rows="6" placeholder="Bænkpres 3x8 90&#10;Roning 3x10 90"></textarea></label><p class="m">Format: navn sæt×reps hvile i sekunder. Hvile er valgfri (standard 90).</p><p id="er" class="err"></p><div class="acts"><button class="btn p" data-a="saveplan">Gem plan</button><button class="btn" data-a="close">Annullér</button></div>`);
A.saveplan=()=>{const n=$('#pn').value.trim(),ex=[],e=$('#er');if(!n)return e.textContent='Giv planen et navn.';for(const ln of $('#px').value.split('\n').map(s=>s.trim()).filter(Boolean)){const r=ln.match(/^(.+?)\s+(\d+)\s*[x×]\s*(\d+)(?:\s+(\d+))?$/i);if(!r)return e.textContent=`Kan ikke læse: "${ln}". Brug fx Bænkpres 3x8 90.`;const o={n:r[1],sets:+r[2],reps:+r[3],rest:r[4]?+r[4]:90};if(!(o.sets>=1&&o.sets<=10&&o.reps>=1&&o.reps<=100&&o.rest<=600))return e.textContent=`Tjek tallene for "${r[1]}": 1–10 sæt, 1–100 reps, hvile højst 600 s.`;ex.push(o)}if(!ex.length)return e.textContent='Tilføj mindst én øvelse.';S.plans.push({id:uid(),name:n,ex});save();close();render()};
A.delplan=v=>ask('Slet denne plan?',()=>{S.plans=S.plans.filter(x=>x.id!==v);save();render()});
const go=p=>{S.active={id:uid(),name:p.name,start:Date.now(),ei:0,ex:p.ex.map(e=>{const pr=prev(e.n);const w=pr?String(pr[pr.length-1].w):'';return{n:e.n,rest:e.rest,sets:e.sets,reps:e.reps,s:Array.from({length:e.sets},()=>({w,r:'',d:false}))}})};T={end:0,left:0,run:false};save();render()};
A.start=v=>{const p=S.plans.find(x=>x.id===v);if(!p)return;S.active?ask('Erstat den igangværende træning?',()=>go(p)):go(p)};
A.sd=v=>{const e=S.active.ex[S.active.ei],s=e.s[v];s.d=!s.d;if(s.d){if(s.r==='')s.r=String(e.reps);T={end:Date.now()+e.rest*1000,left:e.rest*1000,run:true}}save();render()};
A.aset=()=>{const e=S.active.ex[S.active.ei],l=e.s[e.s.length-1];e.s.push({w:l?l.w:'',r:'',d:false});save();render()};
A.ts=()=>{T={end:Date.now()+S.active.ex[S.active.ei].rest*1000,left:0,run:true};render()};
A.tp=()=>{T={run:false,end:0,left:Math.max(0,T.end-Date.now())};render()};A.tr=()=>{T={run:true,end:Date.now()+T.left,left:T.left};render()};A.tz=()=>{T={run:false,end:0,left:0};render()};
A.nex=()=>{S.active.ei++;save();render()};A.pex=()=>{S.active.ei--;save();render()};
A.fin=()=>{const a=S.active,ex=a.ex.map(e=>({n:e.n,sets:e.s.filter(s=>s.d).map(s=>({w:num(s.w),r:num(s.r)}))})).filter(e=>e.sets.length);if(!ex.length)return ask('Ingen sæt er afsluttet. Kassér træningen?',()=>{S.active=null;save();render()});const vol=ex.reduce((x,e)=>x+e.sets.reduce((y,s)=>y+s.w*s.r,0),0);S.sessions.push({id:uid(),date:today(),name:a.name,dur:Math.round((Date.now()-a.start)/1000),vol:Math.round(vol),ex});S.active=null;save();toast('Træning gemt');render()};
A.dis=()=>ask('Kassér træningen? Loggede sæt går tabt.',()=>{S.active=null;save();render()});
A.range=v=>{V.range=+v;render()};
A.logw=()=>{const v=Number($('#wv').value);if(!(v>=20&&v<=400))return $('#er').textContent='Vægt skal være mellem 20 og 400 kg.';S.weights[today()]=v;save();render()};
A.delw=v=>ask('Slet denne måling?',()=>{delete S.weights[v];save();render()});
A.savet=()=>{S.t={kcal:num($('#tk').value),p:num($('#tp').value),water:num($('#tw').value)};save();toast('Mål gemt')};
A.theme=v=>{S.theme=v;document.documentElement.dataset.theme=v;save();render()};
A.exp=()=>{$('#bk').value=JSON.stringify(S)};
A.cp=async()=>{const t=$('#bk');if(!t.value)return toast('Tryk først på Vis backup');try{await navigator.clipboard.writeText(t.value);toast('Kopieret')}catch{t.select();toast('Marker og kopiér teksten manuelt')}};
A.imp=()=>{try{const d=JSON.parse($('#bk').value);if(!d||!Array.isArray(d.meals))throw 0;ask('Erstat alle nuværende data med denne backup?',()=>{S=clean(d);document.documentElement.dataset.theme=S.theme;save();render();toast('Backup importeret')})}catch{toast('Det er ikke en gyldig backup')}};
A.wipe=()=>modal(`<h2>Slet alle data</h2><p>Det kan ikke fortrydes. Skriv SLET for at bekræfte.</p><input id="wp" aria-label="Bekræft"><div class="acts"><button class="btn p" data-a="wipe2">Slet alt</button><button class="btn" data-a="close">Annullér</button></div>`);
A.wipe2=()=>{if($('#wp').value!=='SLET')return toast('Skriv SLET');S=def();save();close();render()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el){const f=A[el.dataset.a];f&&f(el.dataset.v,el)}else if(e.target.id==='modal')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&S.active){S.active.ex[S.active.ei].s[+t.dataset.i][t.dataset.f]=t.value;save()}else if(t.id==='fq')$('#fl').innerHTML=flist(t.value);else if(t.id==='gq'&&M.f)pv()});
setInterval(()=>{const t=$('#tm');if(t){t.textContent=mmss(left());const el=$('#el');if(el&&S.active)el.textContent=mmss((Date.now()-S.active.start)/1000)}},500);
document.documentElement.dataset.theme=S.theme;render();
</script></body></html>
